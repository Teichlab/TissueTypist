name: tissuetypist
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.12
  - pip

  # Core scientific stack
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - matplotlib>=3.7
  - seaborn>=0.13

  # Single-cell / spatial
  - anndata>=0.10
  - scanpy>=1.10

  # Machine learning
  - scikit-learn>=1.3

  # Development
  - jupyter
  - ipykernel
  - black
  - ruff
