[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tissuetypist"
version = "0.1.0"
description = "Cardiac tissue niche classifier for spatial transcriptomics"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Kazumasa Kanemaru" },
    { name = "Teichmann Lab" },
]
keywords = [
    "spatial transcriptomics",
    "tissue classification",
    "single-cell",
    "Visium",
    "VisiumHD",
    "Xenium",
    "MERFISH",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]

dependencies = [
    "anndata>=0.10",
    "scanpy>=1.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pyyaml>=6",
    "joblib>=1.3",
]

[project.urls]
Homepage = "https://github.com/Teichlab/TissueTypist"
Repository = "https://github.com/Teichlab/TissueTypist"
Issues = "https://github.com/Teichlab/TissueTypist/issues"
Documentation = "https://github.com/Teichlab/TissueTypist/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "black",
    "ruff",
    "ipykernel",
    "jupyter",
]

[project.scripts]
tissuetypist = "tissuetypist.cli.main:entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["tissuetypist*"]

[tool.setuptools.package-data]
tissuetypist = [
    "config/hierarchies/*.yaml",
    "models/**/*.joblib",
    "models/**/*.txt",
    "models/**/*.json",
]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 88
